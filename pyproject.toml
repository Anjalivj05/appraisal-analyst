[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appraisal-analyst"
version = "0.1.0"
description = "An explainable HR analytics application for evaluating employee performance-review comments."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "streamlit>=1.60,<2",
    "pandas>=3,<4",
    "scikit-learn>=1.9,<2",
    "python-dotenv>=1.2,<2",
    "openai>=2.53,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]